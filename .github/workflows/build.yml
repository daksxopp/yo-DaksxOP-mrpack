
name: Build DaksxOP MRPack Builder APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Check Manifest
        run: |
          echo "Checking AndroidManifest.xml"
          cat -n app/src/main/AndroidManifest.xml
          xmllint --noout app/src/main/AndroidManifest.xml

      - name: Build APK
        run: gradle assembleDebug --stacktrace --info

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DaksxOP-MRPack-Builder-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
